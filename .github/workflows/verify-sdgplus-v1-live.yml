name: Verify public SDG+ v1.0 release

on:
  push:
    branches: [codex/sdgplus-v1-live-check]

permissions: {}

jobs:
  verify:
    if: github.repository == 'sustynats/wirkungsoekonomie-medien'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check live pages, navigation, search and versioned data
        shell: bash
        run: |
          set -euo pipefail
          python3 -u - <<'PY'
          import gzip
          import hashlib
          import html
          import json
          import re
          import time
          from concurrent.futures import ThreadPoolExecutor
          from urllib.parse import urljoin, urlsplit
          from urllib.request import Request, urlopen

          origin = 'https://wirkungsoekonomie.de'
          assets = 'https://github.com/sustynats/wirkungsoekonomie-medien/releases/download/woek-sdgplus-v1/'
          roots = {'de': '/verstehen/sdgs-sdgplus/', 'en': '/en/sdg-plus/'}

          def read(url):
              req = Request(url, headers={'Cache-Control': 'no-cache', 'User-Agent': 'WOeK-SDGplus-release-verification/1.0'})
              with urlopen(req, timeout=20) as res:
                  assert res.status == 200, (url, res.status)
                  return res.read()

          def page(path):
              return read(origin + path).decode('utf-8')

          def links(path, content):
              return {urlsplit(urljoin(origin + path, html.unescape(item))).path
                      for item in re.findall(r'<a\b[^>]*\bhref=["\']([^"\']+)["\']', content, re.I)}

          raw = read(assets + 'sdgplus-reference.json')
          assert hashlib.sha256(raw).hexdigest() == 'ad482e092422779f2f81a72812f7069f8c68d59dbb89830c12a9c0fa42d71768'
          reference = json.loads(raw)
          goals = reference['goals']
          assert [goal['number'] for goal in goals] == list(range(1, 10))
          for attempt in range(7):
              try:
                  current = json.loads(read(origin + '/api/v1/sdg-plus/reference-v1.json'))
                  assert current == reference
                  break
              except Exception:
                  if attempt == 6:
                      raise
                  time.sleep(15)
          print('Live reference JSON equals the SHA-verified media edition.')
          matrix = json.loads(read(origin + '/api/v1/sdg-plus/matrix-v1.json'))
          assert matrix == json.loads(read(assets + 'sdgplus-matrix.json'))
          assert len(matrix['pairs']) == 153
          legacy = json.loads(read(origin + '/api/v1/sdg-plus.json'))
          assert len(legacy['items']) == legacy['count'] == 24
          assert [item['number'] for item in legacy['items'] if item['type'] == 'sdg'] == list(range(1, 18))
          assert len([item for item in legacy['items'] if item['type'] == 'sdgplus']) == 7
          print('Live matrix has 153 rows. Legacy API includes 17 UN goals and seven compatible items.')

          def goal_pages(lang, goal):
              item = goal[lang]
              detail = page(item['detail'])
              glossary = page(item['glossary'])
              assert f'data-sdgplus-goal="{goal["id"]}"' in detail, item['detail']
              assert item['title'] in html.unescape(detail), item['detail']
              assert item['title'] in html.unescape(glossary), item['glossary']
              assert item['detail'] in links(item['glossary'], glossary), item['glossary']
              return item['detail']

          checked = {lang: [] for lang in roots}
          with ThreadPoolExecutor(max_workers=3) as pool:
              for lang, root in roots.items():
                  overview = page(root)
                  assert 'data-sdgplus-reference="1.0"' in overview, root
                  assert re.findall(r'data-sdgplus-number="(\d+)"', overview) == [str(n) for n in range(1, 10)]
                  assert {g[lang]['detail'] for g in goals} <= links(root, overview), root
                  assert root + 'matrix/' in links(root, overview), root
                  assert root + 'toolkit/' in links(root, overview), root
                  assert root + 'glossary/' in links(root, overview), root
                  other_root = roots['en' if lang == 'de' else 'de']
                  assert other_root in links(root, overview), root
                  table = page(root + 'matrix/')
                  assert len(re.findall(r'\bdata-pair(?:\s|=)', table)) == 153
                  toolkit = page(root + 'toolkit/')
                  assert assets + f'sdgplus-kurzuebersicht-{lang}.pdf' in toolkit
                  assert assets + f'sdgplus-zielkarten-{lang}.zip' in toolkit
                  checked[lang].extend(pool.map(lambda goal: goal_pages(lang, goal), goals))
          print(f'HTTP 200 and content verified for both overviews, both matrices, both toolkits, and {sum(map(len, checked.values()))} goal pages plus their glossaries.')

          catalogue = json.loads(read(origin + '/assets/search/browser-index-manifest.json'))
          search_raw = gzip.decompress(read(origin + '/assets/search/' + catalogue['core']['gzip']))
          missing = {lang: [path for path in paths if path.encode() not in search_raw]
                     for lang, paths in checked.items()}
          for lang, paths in missing.items():
              print(f'Browser search {lang}: {len(checked[lang]) - len(paths)}/{len(checked[lang])} goal routes present.')
              for path in paths:
                  print(f'  Missing {lang} search route: {path}')

          guide_path = '/bibliothek/woek-begriffsleitfaden-fuehrend-v1-9/'
          old_path = '/bibliothek/woek-begriffsleitfaden-fuehrend/'
          guide = page(guide_path)
          guide_pdfs = {
              'WOeK_Begriffsleitfaden_fuehrend_v1.9_2026-11-26.pdf': 'd1d95cb10dd7065cdef6858ef88ae39e1a76f206a3e14efeb97d06358b0288d9',
              'WOeK_Begriffsleitfaden_v1.9_SDGplus_Addendum_2026-11-26.pdf': 'eb43eae977550895f3f3dbef3bc359d8b316bda8e4be5cdb44a16c2c86ce06bd',
          }
          for filename, checksum in guide_pdfs.items():
              assert assets + filename in guide, filename
              assert hashlib.sha256(read(assets + filename)).hexdigest() == checksum, filename
          print('Guide v1.9: HTTP 200, complete guide and addendum files linked and SHA-verified.')
          old = page(old_path)
          marker = 'id="sdgplus-stand-v19"' in old
          old_links = links(old_path, old)
          historic_ok = marker and guide_path in old_links and roots['de'] in old_links
          print(f'Guide v1.8 historic notice and links to the current revision: {"PASS" if historic_ok else "OPEN"}.')
          print('Navigation: both overviews link all nine goals, matrix, glossary, toolkit and language counterpart.')
          assert not missing['de'], 'German goal routes missing from search'
          print('SDGPLUS_LIVE_VERIFIED=' + ('PASS' if not missing['en'] and historic_ok else 'PARTIAL'))
          PY
