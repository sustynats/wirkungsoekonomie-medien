name: Publish SDG+ toolkit v1

on:
  push:
    branches:
      - codex/sdgplus-v1-assets
    paths:
      - .github/workflows/publish-sdgplus-v1.yml
      - releases/woek-sdgplus-v1/**

permissions: {}

concurrency:
  group: woek-sdgplus-v1
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'sustynats/wirkungsoekonomie-medien' && github.ref == 'refs/heads/codex/sdgplus-v1-assets'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out the exact public asset commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Publish only the verified edition
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo='sustynats/wirkungsoekonomie-medien'
          tag='woek-sdgplus-v1'
          asset_commit='f74bef484f7f541b4e179a5776dfc8eba40fa6b5'
          draft_url="https://github.com/$repo/releases/tag/untagged-ae49c1842ae8dddd3d15"
          public_url="https://github.com/$repo/releases/tag/$tag"
          [[ "$GITHUB_REPOSITORY" == "$repo" ]]
          [[ "$GITHUB_REF" == 'refs/heads/codex/sdgplus-v1-assets' ]]
          [[ "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ && "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]

          target="refs/tags/$tag"
          [[ "$(git ls-remote --exit-code --refs origin "$target")" == "$asset_commit"$'\t'"$target" ]]
          [[ "$(git rev-parse "$target^{commit}")" == "$asset_commit" ]]
          git diff --quiet --no-ext-diff "$asset_commit" HEAD -- "releases/$tag"
          cd "releases/$tag"
          expected=(sdgplus-handout-{de,en}.pdf sdgplus-kurzuebersicht-{de,en}.pdf
                    sdgplus-matrix-{de,en}.pdf sdgplus-matrix.{csv,json} sdgplus-reference.json
                    sdgplus-workshop-{de,en}.pptx sdgplus-zielkarten-{de,en}.zip
                    WOeK_Begriffsleitfaden_fuehrend_v1.9_2026-11-26.pdf
                    WOeK_Begriffsleitfaden_v1.9_SDGplus_Addendum_2026-11-26.pdf)
          assets=("${expected[@]}" SHA256SUMS.txt)
          diff -u <(printf '%s\n' "${assets[@]}" | LC_ALL=C sort) \
                  <(find . -mindepth 1 -maxdepth 1 -printf '%f\n' | LC_ALL=C sort)
          for asset in "${assets[@]}"; do
            [[ -f "$asset" && -s "$asset" && ! -L "$asset" ]]
          done
          diff -u <(LC_ALL=C sha256sum -- "${expected[@]}") SHA256SUMS.txt

          echo 'Locate the previously created SDG+ release'
          release=$(gh api --paginate "repos/$repo/releases?per_page=100" |
            jq -es --arg draft_url "$draft_url" --arg public_url "$public_url" --arg tag "$tag" '
              add | map(select(.name == "SDG+ Toolkit v1.0" and
                ((.draft == true and .html_url == $draft_url) or
                 (.draft == false and .tag_name == $tag and .html_url == $public_url)))) |
              if length == 1 then .[0] else error("Exact release is missing or ambiguous") end')
          release_id=$(jq -er '.id | select(type == "number" and . > 0)' <<< "$release")
          [[ "$release_id" == 459493334 ]]
          draft=$(jq -r '.draft' <<< "$release")
          upload_endpoint="https://uploads.github.com/repos/$repo/releases/$release_id/assets"
          if [[ "$draft" == true ]]; then
            [[ "$(jq -r '.upload_url' <<< "$release")" == "$upload_endpoint{?name,label}" ]]
          fi

          read_assets() {
            gh api --paginate "repos/$repo/releases/$release_id/assets?per_page=100" |
              jq -es 'add | if all(.[]; (.id | type == "number") and (.state == "uploaded")) and
                (map(.name) | length == (unique | length)) then . else error("Invalid release asset metadata") end'
          }
          verify_asset() {
            local name="$1" id="$2" destination="$3"
            [[ "$id" =~ ^[0-9]+$ ]]
            echo "Download $name by asset ID $id"
            gh api -H 'Accept: application/octet-stream' "repos/$repo/releases/assets/$id" > "$destination"
            cmp -- "$name" "$destination"
          }

          echo "Read existing assets for release $release_id"
          existing=$(read_assets)
          existing_names=$(jq -r '.[].name' <<< "$existing")
          download=$(mktemp -d)
          while IFS= read -r name; do
            if [[ -n "$name" ]]; then
              printf '%s\n' "${assets[@]}" | grep -Fxq -- "$name"
              id=$(jq -er --arg name "$name" '.[] | select(.name == $name).id' <<< "$existing")
              verify_asset "$name" "$id" "$download/$name"
            fi
          done <<< "$existing_names"
          for asset in "${assets[@]}"; do
            if ! grep -Fxq -- "$asset" <<< "$existing_names"; then
              [[ "$draft" == true ]]
              echo "Upload $asset to the verified draft"
              curl -fsS --request POST --header 'Accept: application/vnd.github+json' \
                --header 'X-GitHub-Api-Version: 2022-11-28' \
                --header "Authorization: Bearer $GH_TOKEN" \
                --header 'Content-Type: application/octet-stream' --data-binary "@$asset" \
                "$upload_endpoint?name=$asset" |
                jq -e --arg name "$asset" 'select(.name == $name and .state == "uploaded") | .id | numbers' >/dev/null
            fi
          done
          echo "Read complete release manifest before publication"
          verified=$(read_assets)
          diff -u <(printf '%s\n' "${assets[@]}" | LC_ALL=C sort) \
                  <(jq -r '.[].name' <<< "$verified" | LC_ALL=C sort)
          for asset in "${assets[@]}"; do
            id=$(jq -er --arg name "$asset" '.[] | select(.name == $name).id' <<< "$verified")
            verify_asset "$asset" "$id" "$download/$asset"
          done
          if [[ "$draft" == true ]]; then
            release_tag=$(jq -er '.tag_name | strings' <<< "$release")
            echo "Publish verified release $release_id (current tag field: $release_tag)"
            release_fields=(-F draft=false -f make_latest=false)
            if [[ "$release_tag" != "$tag" ]]; then
              [[ "$release_tag" == 'untagged-ae49c1842ae8dddd3d15' || -z "$release_tag" ]]
              release_fields+=(-f "tag_name=$tag")
            fi
            gh api --method PATCH "repos/$repo/releases/$release_id" "${release_fields[@]}" |
              jq -e --arg id "$release_id" --arg tag "$tag" --arg url "$public_url" \
                'select((.id | tostring) == $id and .tag_name == $tag and .draft == false and .html_url == $url)' >/dev/null
          fi
          [[ "$(git ls-remote --exit-code --refs origin "$target")" == "$asset_commit"$'\t'"$target" ]]
          printf 'Edition: %s\nAsset commit: %s\nWorkflow commit: %s\n' "$public_url" "$asset_commit" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
